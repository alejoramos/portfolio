<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momentum Athletics | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <nav class="navbar">
            <a href="index.html" class="logo">Momentum Athletics</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="sports.html">Sports</a>
                <a href="schedule.html">Schedule</a>
                <a href="contact.html" class="active">Contact</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="page-hero">
            <span class="tag">Contact</span>
            <h1>Join the club.</h1>
            <p>Send a message if you want more information about classes or programs.</p>
        </section>

        <section class="section contact-layout">
            <div class="info-box">
                <h2>Club Info</h2>
                <p>Email: hello@momentumathletics.com</p>
                <p>Phone: (555) 456-7890</p>
                <p>Location: Community Sports Center</p>
            </div>

            <form class="contact-form" id="contact-form">
                <label>
                    Name
                    <input type="text" placeholder="Your name" required>
                </label>
                <label>
                    Email
                    <input type="email" placeholder="you@example.com" required>
                </label>
                <label>
                    Message
                    <textarea placeholder="Tell us what sport you are interested in" required></textarea>
                </label>
                <button type="submit" class="btn primary">Send Message</button>
                <p id="form-message" class="form-message"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Momentum Athletics</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
