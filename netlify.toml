# Static site, nothing to build. Netlify serves this folder as is, including
# the store's committed build output.

[build]
  publish = "."
  command = ""

# The store is a React single page app that lives in a subfolder, so its build
# output has to be mapped onto the URL it is served from. Assets resolve into
# the build directory; anything else under /store hands back the app shell, so
# client side routes survive a refresh or a shared link.
#
# force is required. Netlify serves a matching static file before it considers
# a redirect, and store/index.html is Vite's source template pointing at
# /src/main.tsx, which only exists while the dev server is running. Without
# force, /store would serve that template and the page would come up blank.
[[redirects]]
  from = "/store/assets/*"
  to = "/store/dist/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/store/*"
  to = "/store/dist/index.html"
  status = 200
  force = true

# Grouchy's is an Astro site, so unlike the store it builds real pages rather
# than one shell, and each one lands in its own folder as an index.html.
#
# The pages are listed one by one on purpose. A single catch-all would rewrite
# /grouchys/menu to /grouchys/dist/menu, which is a directory, and whether that
# resolves to its index.html is left to the host. Naming the file removes the
# guess. The catch-all underneath then only has to carry assets.
[[redirects]]
  from = "/grouchys"
  to = "/grouchys/dist/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/grouchys/menu"
  to = "/grouchys/dist/menu/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/grouchys/about"
  to = "/grouchys/dist/about/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/grouchys/gallery"
  to = "/grouchys/dist/gallery/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/grouchys/visit"
  to = "/grouchys/dist/visit/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/grouchys/reserve"
  to = "/grouchys/dist/reserve/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/grouchys/*"
  to = "/grouchys/dist/:splat"
  status = 200
  force = true

# Long cache for assets that rarely change. HTML stays fresh so edits go live immediately.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Vite puts a content hash in every filename here, so these can never go stale.
[[headers]]
  for = "/store/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
