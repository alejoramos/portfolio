# Static site, nothing to build. Netlify serves this folder as is, including
# the store's committed build output.

[build]
  publish = "."
  command = ""

# Store SPA: assets map into its build and other /store paths get the app shell.
# force is needed, or Netlify serves Vite's source template and the page is blank.
[[redirects]]
  from = "/store/assets/*"
  to = "/store/dist/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/store/*"
  to = "/store/dist/index.html"
  status = 200
  force = true

# Grouchy's builds one index.html per page folder, so each page is named here;
# a catch-all to a bare directory would leave index resolution to the host.
[[redirects]]
  from = "/grouchys"
  to = "/grouchys/dist/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/grouchys/menu"
  to = "/grouchys/dist/menu/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/grouchys/about"
  to = "/grouchys/dist/about/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/grouchys/gallery"
  to = "/grouchys/dist/gallery/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/grouchys/visit"
  to = "/grouchys/dist/visit/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/grouchys/reserve"
  to = "/grouchys/dist/reserve/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/grouchys/*"
  to = "/grouchys/dist/:splat"
  status = 200
  force = true

# Long cache for assets that rarely change. HTML stays fresh so edits go live immediately.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Vite puts a content hash in every filename here, so these can never go stale.
[[headers]]
  for = "/store/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
