<!-- Favicon drops the chevrons. At 16px the full <E/R> lockup would be
     unreadable, so the square version keeps only the three glyphs. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Eddy Ramos">
  <rect width="32" height="32" fill="#16161a"/>
  <g transform="translate(2.5 10.2) scale(0.391) translate(6 -1) skewX(-11)">
    <g fill="#f2f0ea">
      <rect x="0" y="3" width="5" height="26"/>
      <rect x="0" y="3" width="15" height="5"/>
      <rect x="0" y="13.5" width="12.5" height="5"/>
      <rect x="0" y="24" width="15" height="5"/>
      <rect x="41" y="3" width="5" height="26"/>
      <rect x="41" y="3" width="18" height="5"/>
      <rect x="54" y="3" width="5" height="15"/>
      <rect x="41" y="13" width="18" height="5"/>
      <polygon points="53.5,18 59,18 64,29 58.5,29"/>
    </g>
    <polygon points="29,1 34.5,1 27.5,31 22,31" fill="#4fc48d"/>
  </g>
</svg>
